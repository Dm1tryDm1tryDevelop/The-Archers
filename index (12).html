<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ragdoll Archers</title>
<style>

<script>
const $=i=>document.getElementById(i),C=$('c'),X=C.getContext('2d'),ov=$('ov'),jump=$('jump'),pz=$('pz');
const W=1100,H=500,DPR=Math.min(devicePixelRatio||1,2);let S=1,OX=0,OY=0;
function rs(){C.width=innerWidth*DPR;C.height=innerHeight*DPR;S=Math.min(C.width/W,C.height/H);OX=(C.width-W*S)/2;OY=(C.height-H*S)/2;jump.style.left=((OX+110*S)/DPR-11*innerHeight/100*1)+'px'}
addEventListener('resize',rs);rs();
let sv={coins:0,max:1,skin:0,own:[0],dmg:0,hp:0,kills:0,snd:1,vib:1,wins:0};
try{Object.assign(sv,JSON.parse(localStorage.ra))}catch(e){}

const SK=[{n:'Классик',c:'#fff',b:'#ffb020',p:0},{n:'Красный',c:'#ff6a6a',b:'#ffe',p:100},{n:'Синий',c:'#6ad0ff',b:'#fff',p:150},{n:'Зелёный',c:'#76ff92',b:'#d4ff76',p:200},{n:'Золотой',c:'#ffd24a',b:'#fff3b0',p:400},{n:'Неон',c:'#d46bff',b:'#6bffea',p:600},{n:'Тень',c:'#555a6e',b:'#ff4a4a',p:500},{n:'Радуга',c:'rb',b:'#fff',p:900}];
const TY={g:{hp:60,s:1,err:.10,rl:2.6,c:'#e8e8e8',b:'#b86',pu:.85,n:1,jp:.5,dm:1},f:{hp:50,s:.95,err:.07,rl:1.7,c:'#ffe27a',b:'#fa0',pu:.9,n:1,jp:1,dm:.9},t:{hp:170,s:1.25,err:.09,rl:3.2,c:'#ff9a9a',b:'#a33',pu:.9,n:1,jp:.2,dm:1.3,az:1.6},s:{hp:70,s:1,err:.025,rl:3.6,c:'#9affb0',b:'#2c6',pu:1,n:1,jp:.4,dm:1.5,az:1.2},m:{hp:110,s:1.05,err:.08,rl:3,c:'#c79aff',b:'#85f',pu:.95,n:3,jp:.5,dm:.8},i:{hp:35,s:.7,err:.08,rl:1.2,c:'#9ad8ff',b:'#4af',pu:.9,n:1,jp:1.2,dm:.7,az:.8},p:{hp:80,s:1,err:.07,rl:2.4,c:'#ff9040',b:'#f50',pu:.9,n:1,jp:.5,dm:1,fire:1},x:{hp:90,s:1.1,err:.09,rl:3.6,c:'#8a8a8a',b:'#444',pu:.95,n:1,jp:.3,dm:1,bomb:1,az:1.3},b:{hp:380,s:1.5,err:.05,rl:2.2,c:'#ff4d4d',b:'#ff0',pu:1,n:3,jp:.3,dm:1.4,az:1.6}};
const TH=[['#252b4a','#7a829e','#3a4163'],['#4a2a52','#e89a6a','#6a3a5a'],['#1c3b4a','#8ad0e0','#2f5a6a'],['#4a2a18','#f0b050','#7a4a28'],['#3a1010','#d85a30','#5a2018'],['#1a2a1a','#7ab070','#2c4a2c']];
const VMIN=4,VMAX=15,G=.18,GR=.25,NID='rda1-';
let st='menu',mode='camp',paused=false,L=1,sel=1,kills=0,total=0,spawned=0,maxA=1,sl=[],en=[],ar=[],rg=[],pt=[],fl=[],it=[],ob=[],rings=[],bq=[],P,aim=null,shake=0,flash=0,fc='255,0,0',slow=0,t=0,spT=0,iT=5,runC=0,endT=0,uid=0,hm=1,em=1,rm=1,TM=TH[0],dif=1,combo=0,gcd=0,la=0,net={role:null,conn:null,peer:null};
const bgs=Array.from({length:70},()=>({x:Math.random()*1500-200,y:Math.random()*500,v:Math.random()*.9+.3,s:Math.random()*2+1}));
function rnd(a,b){return a+Math.random()*(b-a)}const gs=()=>Math.random()+Math.random()+Math.random()-1.5;
let AC;function snd(f,d,ty='sine',v=.08,f2){if(!sv.snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const vib=n=>{try{sv.vib&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const F=o=>Object.assign({x:0,y:340,oy:0,vy:0,s:1,hp:100,max:100,col:'#fff',bow:'#fa0',a:.3,draw:0,f:1,cd:0,hit:0,burn:0,k:[],az:1,st:100,pl:0},o);
const me=()=>net.role==='guest'&&mode==='net'?en[0]:P;
function mkP(){const k=SK[sv.skin],h=100+20*sv.hp;P=F({x:110,col:k.c,bow:k.b,hp:h,max:h,pl:1,pk:{fire:0,tri:0,bomb:0},dmgb:30+4.5*sv.dmg});if(mode==='net'){P.hp=P.max=100;P.dmgb=30}}
function mkObj(a){const[cx,w,h,by,mt,amp,sp,ph]=a;return{a,x1:cx-w/2,x2:cx+w/2,y1:by,y2:by+h,h,by,mt,amp,sp,ph}}
function genOb(n){ob=[];for(let i=0;i<n;i++)ob.push(mkObj([(W*(.33+.34*(i+Math.random()*.7)/Math.max(n,1)))|0,rnd(16,26)|0,rnd(70,115)|0,rnd(120,270)|0,L>=4&&Math.random()<.35?1:0,L>=3&&Math.random()<.5?rnd(30,70)|0:0,rnd(.6,1.4),rnd(0,6)]))}
function R(){const r=[{x1:55,x2:165,y1:340,y2:H+60}];for(const s of sl){const x=W*s.f;r.push({x1:x-42,x2:x+42,y1:s.top,y2:H+60})}return r.concat(ob)}
function mkE(k,o,s){const T=TY[k];const e=F(Object.assign({id:++uid,ty:k,x:W*s.f,y:s.top,s:T.s,hp:T.hp*hm,max:T.hp*hm,col:T.c,bow:T.b,f:-1,cd:rnd(1,2.2),ph:0,dur:.9,err:T.err*em,rl:T.rl*rm,pu:T.pu,n:T.n,jp:T.jp*Math.min(.6,.1+.04*L),dmgb:(12+L*1.3)*T.dm,pf:0,az:T.az||1,bomb:T.bomb,fire:T.fire,slot:s,pl:0,pull:.9,tg:.3,a0:.3},o));s.e=e;en.push(e);return e}
/* ---------- UI ---------- */
function show(h){ov.innerHTML='<div class=pn>'+h+'</div>';ov.style.display='flex'}
function hud(v){jump.style.display=pz.style.display=v?'block':'none'}
function leave(){clearTimeout(net.to);try{net.conn&&net.conn.close()}catch(e){}try{net.peer&&net.peer.destroy()}catch(e){}net={role:null,conn:null,peer:null}}
function reset(){en=[];ar=[];rg=[];pt=[];fl=[];it=[];rings=[];bq=[];ob=[];sl=[];aim=null;kills=0;spawned=0;runC=0;iT=4;shake=flash=0;combo=0;mkP()}
function go(){paused=false;st='play';ov.style.display='none';hud(1)}
function menu(){leave();st='menu';mode='camp';paused=false;hud(0);L=1;reset();TM=TH[0];sel=Math.max(1,Math.min(sel,sv.max));
show(`<h1>RAGDOLL<br>ARCHERS</h1><div class=co>🪙 ${sv.coins} · 💀 ${sv.kills} · 🏆 ${sv.wins}</div><div class=row><button onclick="lv(-1)">◀</button><button class=big onclick="start(${sel})">▶ КАМПАНИЯ · ${sel}</button><button onclick="lv(1)">▶</button></div><button onclick="botMenu()">🤖 Дуэль с ботом</button><button onclick="onl()">🌐 Онлайн</button><br><button onclick="shop()">🛒 Лавка</button><button onclick="opts()">⚙️ Настройки</button>`)}
function lv(d){sel=Math.max(1,Math.min(sv.max,sel+d));menu()}
function opts(){show(`<h2>Настройки</h2><button onclick="sv.snd^=1;save();opts()">Звук: ${sv.snd?'вкл':'выкл'}</button><button onclick="sv.vib^=1;save();opts()">Вибро: ${sv.vib?'вкл':'выкл'}</button><br><button onclick="menu()">Назад</button>`)}
function shop(){const dc=60+sv.dmg*60,hc=60+sv.hp*60;let h=`<h2>Лавка</h2><div class=co>🪙 ${sv.coins}</div><div class=g>`;SK.forEach((k,i)=>{const o=sv.own.includes(i);h+=`<button class="sk${sv.skin==i?' on':''}" onclick="buy(${i})"><i style="background:${k.c=='rb'?'linear-gradient(90deg,red,lime,blue)':k.c}"></i>${k.n}<br><small>${o?(sv.skin==i?'выбран':'выбрать'):'🪙 '+k.p}</small></button>`});h+=`</div><div class=row><button onclick="up('dmg')">Урон ${sv.dmg}/8 · 🪙${dc}</button><button onclick="up('hp')">Здоровье ${sv.hp}/8 · 🪙${hc}</button></div><button onclick="menu()">Назад</button>`;show(h)}
function buy(i){if(sv.own.includes(i))sv.skin=i;else if(sv.coins>=SK[i].p){sv.coins-=SK[i].p;sv.own.push(i);sv.skin=i}save();shop()}
function up(k){const c=60+sv[k]*60;if(sv[k]<8&&sv.coins>=c){sv.coins-=c;sv[k]++;save()}shop()}
function start(l){mode='camp';L=l;sel=l;TM=TH[(l-1)%6];reset();total=Math.min(20,4+l);maxA=l<3?1:l<7?2:3;hm=1+.1*(l-1);em=Math.max(.3,1-.045*l);rm=Math.max(.55,1-.03*l);spT=.8;
const fs=[.42,.52,.62,.72,.82,.9].sort(()=>Math.random()-.5).slice(0,4).sort();sl=fs.map(f=>({f,top:rnd(295,370)|0,e:null}));genOb(Math.min(3,l>>1));go()}
function botMenu(){show(`<h2>Дуэль с ботом</h2><button onclick="duel(0)">😀 Лёгкий</button><button onclick="duel(1)">😐 Средний</button><button onclick="duel(2)">😈 Сложный</button><br><button onclick="menu()">Назад</button>`)}
function duel(d){leave();mode='duel';dif=d;L=1+d*2;hm=em=rm=1;TM=TH[Math.random()*6|0];reset();sl=[{f:990/W,top:340,e:null}];genOb(d+(Math.random()*2|0));total=1;const D=[{err:.12,rl:2.4,jp:.15,pf:0},{err:.06,rl:1.8,jp:.35,pf:.15},{err:.025,rl:1.3,jp:.6,pf:.3}][d];mkE('g',{hp:100,max:100,err:D.err,rl:D.rl,jp:D.jp,pf:D.pf,dmgb:24+d*4,col:'#ff7a7a',bow:'#fa0',pu:.9},sl[0]);go()}
function endScr(win){hud(0);const was=mode;st='menu';let b=0;
if(was==='camp'){if(win){sv.max=Math.max(sv.max,L+1);b=20+L*5;sv.coins+=b;runC+=b}save();show(win?`<h1>ПОБЕДА!</h1><div class=co>Уровень ${L} пройден · +🪙 ${runC}</div><button class=big onclick="start(${L+1})">Дальше ▶</button><br><button onclick="sel=${L+1};menu()">Меню</button>`:`<h1>ПОРАЖЕНИЕ</h1><div class=co>Убито ${kills}/${total} · +🪙 ${runC}</div><button class=big onclick="start(${L})">Ещё раз ↻</button><br><button onclick="menu()">Меню</button>`)}
else{b=(win?40:10)+runC;sv.coins+=b;if(win)sv.wins++;save();show(`<h1>${win?'ПОБЕДА!':'ПОРАЖЕНИЕ'}</h1><div class=co>+🪙 ${b}</div>${was==='duel'?`<button class=big onclick="duel(${dif})">Реванш ↻</button><br>`:''}<button onclick="menu()">Меню</button>`)}}
pz.onclick=()=>{if(st!=='play')return;if(mode==='net'){show(`<h2>Выйти из матча?</h2><button onclick="ov.style.display='none'">Остаться</button><button onclick="menu()">Выйти</button>`);return}paused=true;aim=null;show(`<h2>Пауза</h2><button class=big onclick="paused=false;ov.style.display='none'">Продолжить</button><br><button onclick="menu()">В меню</button>`)};
jump.onpointerdown=e=>{e.preventDefault();if(st!=='play'||paused)return;const m=me();if(net.role==='guest'){if(m.st>=35)nsend({t:'j'})}else if(P.st>=35&&P.oy===0){P.st-=35;P.vy=-7.5;snd(300,.15,'sine',.06,600)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play'&&mode!=='net')pz.onclick()});
/* ---------- network ---------- */
const noNet=()=>show('<h2>Нет подключения к сети</h2><button onclick="menu()">Назад</button>');
function onl(){show(`<h2>Онлайн дуэль</h2><button class=big onclick="quick()">⚡ Быстрый бой</button><br><button onclick="mkRoom()">🔑 Создать комнату</button><button onclick="joinUI()">Войти по коду</button><br><button onclick="menu()">Назад</button>`)}

function nsend(o){try{net.conn&&net.conn.open&&net.conn.send(o)}catch(e){}}

function setNet(o){net=Object.assign({send:nsend},o)}
function leave2(){leave();setNet({role:null,conn:null,peer:null})}
function quick(){if(!window.Peer)return noNet();scan(0)}
function scan(i){if(i>2)i=0;leave2();net.q=1;show(`<h2>🔎 Ищем соперника…</h2><div class=co>комната ${i+1}</div><button onclick="duelFb()">Играть с ботом</button><button onclick="menu()">Отмена</button>`);
const p=new Peer(NID+'q'+i);net.peer=p;
p.on('open',()=>{net.role='host';p.on('connection',c=>{if(net.conn){c.on('open',()=>c.close());return}wire(c)});net.to=setTimeout(()=>{if(!net.conn&&mode!=='net')scan(i+1)},rnd(7000,13000))});
p.on('error',e=>{if(e.type==='unavailable-id')joinSlot(i);else if(mode!=='net')net.to=setTimeout(()=>scan(i+1),1500)})}
function joinSlot(i){try{net.peer.destroy()}catch(e){}const p=new Peer();net.peer=p;
p.on('open',()=>{const c=p.connect(NID+'q'+i,{reliable:true});c.on('open',()=>{net.role='guest';wire(c);c.send({t:'hi',s:sv.skin});net.to=setTimeout(()=>{if(mode!=='net')scan(i+1)},4000)});c.on('close',()=>{if(mode!=='net'&&net.q)scan(i+1)})});
p.on('error',()=>{if(mode!=='net')net.to=setTimeout(()=>scan(i+1),800)})}
function duelFb(){leave2();duel(1)}
function mkRoom(){if(!window.Peer)return noNet();leave2();const code=1000+(Math.random()*9000|0),p=new Peer(NID+'r'+code);net.peer=p;
p.on('open',()=>{net.role='host';show(`<h2>Код комнаты</h2><h1>${code}</h1><div class=co>Скажи код другу — он нажимает «Войти по коду»</div><button onclick="menu()">Отмена</button>`)});
p.on('connection',c=>{if(net.conn){c.close();return}wire(c)});p.on('error',e=>{if(e.type==='unavailable-id')mkRoom();else show('<h2>Ошибка сети</h2><button onclick="menu()">Назад</button>')})}
function joinUI(){show(`<h2>Код комнаты</h2><input id=cd maxlength=4 inputmode=numeric><br><button class=big onclick="join()">Войти</button><br><button onclick="onl()">Назад</button>`)}
function join(){const code=$('cd').value.trim();if(!window.Peer)return noNet();leave2();show('<h2>Подключение…</h2><button onclick="menu()">Отмена</button>');const p=new Peer();net.peer=p;const bad=()=>show('<h2>Комната не найдена</h2><button onclick="joinUI()">Назад</button>');
p.on('open',()=>{const c=p.connect(NID+'r'+code,{reliable:true});c.on('open',()=>{net.role='guest';wire(c);c.send({t:'hi',s:sv.skin})});net.to=setTimeout(()=>{if(!net.conn)bad()},8000)});p.on('error',bad)}
function wire(c){net.conn=c;clearTimeout(net.to);c.on('data',onMsg);c.on('close',()=>{if(mode==='net'&&st!=='menu'){leave2();hud(0);st='menu';show('<h2>Соперник вышел</h2><button class=big onclick="menu()">Меню</button>')}})}
function netDuel(gs){clearTimeout(net.to);mode='net';L=3;hm=em=rm=1;const ti=Math.random()*6|0;TM=TH[ti];reset();sl=[{f:990/W,top:340,e:null}];genOb(Math.random()*3|0);const k=SK[gs]||SK[0];mkE('g',{hp:100,max:100,col:k.c,bow:k.b,rem:1,pk:{fire:0,tri:0,bomb:0},dmgb:30},sl[0]);nsend({t:'st',hs:sv.skin,gs,th:ti,ob:ob.map(o=>o.a)});go()}
function netGuest(m){clearTimeout(net.to);mode='net';L=3;hm=em=rm=1;TM=TH[m.th];reset();const a=SK[m.hs]||SK[0],b=SK[m.gs]||SK[0];P=F({x:110,col:a.c,bow:a.b,pl:1,pk:{fire:0,tri:0,bomb:0}});sl=[{f:990/W,top:340,e:null}];ob=m.ob.map(mkObj);mkE('g',{hp:100,max:100,col:b.c,bow:b.b,rem:1,pk:{fire:0,tri:0,bomb:0}},sl[0]);go()}
function onMsg(m){if(m.t==='hi'&&net.role==='host'&&mode!=='net'){netDuel(m.s);return}
if(m.t==='st'&&net.role==='guest'){netGuest(m);return}
if(net.role==='host'&&mode==='net'&&en[0]){const o=en[0];if(m.t==='a'){o.a=m.th;o.draw=m.pull;o.ta=t}if(m.t==='s'&&o.cd<=0&&st==='play'&&o.hp>0){shootC(o,m.th,m.pull);o.draw=0}if(m.t==='j'&&st==='play'&&o.st>=35&&o.oy===0){o.st-=35;o.vy=-7.5}}
if(net.role==='guest'&&mode==='net'){if(m.t==='S')unp(m);else if(m.t==='f')V(m.n,m.x,m.y,m.a);else if(m.t==='rg')mk(m.c,m.vx,m.vy);else if(m.t==='end')setTimeout(()=>{if(st!=='menu')endScr(m.w)},1500)}}
function pack(){const f=c=>[c.x,c.y,c.oy|0,c.hp|0,c.max,+c.a.toFixed(2),+c.draw.toFixed(2),c.hit,c.burn>0?1:0,c.k,c.st|0,c.pk,+c.cd.toFixed(2)];
return{t:'S',p:f(P),o:f(en[0]),ar:ar.map(a=>[a.x|0,a.y|0,+a.vx.toFixed(2),+a.vy.toFixed(2),a.pl,+a.an.toFixed(2),a.stuck?1:0,a.fire?1:0,a.bomb?1:0,a.sz,a.wob|0,a.tum?1:0,+(a.w||0).toFixed(2)]),it:it.map(m=>[m.k,m.x|0,m.y|0,+m.rot.toFixed(2),m.sk,+m.vx.toFixed(2),+m.vy.toFixed(2),+m.w.toFixed(2)]),ob:ob.map(o=>o.y1|0)}}
